<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Caroling Chill Festival · Traducción en vivo</title>
<link rel="icon" href="logo.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Mountains+of+Christmas:wght@700&family=Nunito:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--navy:#060c2e;--navy2:#16236a;--aqua:#8ee6ec;--gold:#ffd23f;--red:#ff4d5e;--scale:1;--size:calc(min(7.4vw,12vh)*var(--scale))}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--navy);color:#fff;font-family:Nunito,system-ui,sans-serif;overflow:hidden}
#snow,#hills{position:fixed;inset:0;pointer-events:none;z-index:0}
#hills{top:auto;height:9vh;width:100%;opacity:.8}
.layer{position:fixed;inset:0;z-index:1}

/* --- Pantalla de espera --- */
#welcome{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.8vh;padding-bottom:9vh;text-align:center;transition:opacity .5s}
#welcome img{width:clamp(90px,18vh,180px);height:clamp(90px,18vh,180px);object-fit:cover;border-radius:22%;box-shadow:0 0 0 4px var(--gold),0 18px 40px rgba(0,0,0,.35)}
.pre{font-size:clamp(16px,2.6vh,22px);font-weight:600;letter-spacing:.02em;color:var(--aqua)}
.big-title{font-family:"Mountains of Christmas",cursive;font-weight:700;font-size:clamp(44px,12vh,120px);line-height:.95;color:var(--gold);text-shadow:0 6px 30px rgba(0,0,0,.35);padding:0 4vw}
.sub{font-size:clamp(18px,3.4vh,30px);font-weight:600;opacity:.85}

/* --- Pantalla en vivo --- */
#live-screen{opacity:0;pointer-events:none;transition:opacity .5s}
body.on #welcome{opacity:0;pointer-events:none}
body.on #live-screen,body.started #live-screen{opacity:1;pointer-events:auto}
body.started #welcome{opacity:0;pointer-events:none}
header{position:absolute;top:2.5vh;left:4vw;right:4vw;display:flex;align-items:center;justify-content:space-between;gap:24px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:18px}
.brand img{width:clamp(48px,9vh,90px);height:clamp(48px,9vh,90px);object-fit:cover;border-radius:22%;box-shadow:0 0 0 3px var(--gold)}
.brand .pre{font-size:clamp(13px,2vh,17px)}
.brand .t{font-family:"Mountains of Christmas",cursive;font-weight:700;font-size:clamp(26px,5vh,52px);line-height:1;color:var(--gold)}
.pill{display:flex;align-items:center;gap:10px;padding:10px 18px;border-radius:999px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);font-size:clamp(14px,2.2vh,18px);font-weight:600;white-space:nowrap}
.dot{width:12px;height:12px;border-radius:50%;background:var(--aqua)}
body.on .dot{background:var(--red);animation:pulse 1.4s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,77,94,.6)}70%{box-shadow:0 0 0 12px rgba(255,77,94,0)}100%{box-shadow:0 0 0 0 rgba(255,77,94,0)}}
main{position:absolute;left:4vw;right:4vw;top:15vh;bottom:9vh;display:flex;flex-direction:column;justify-content:center;gap:2vh}
#history{display:flex;flex-direction:column;gap:1vh;opacity:.6;overflow:hidden;flex:none}
.line{font-size:calc(var(--size)*.5);font-weight:700;line-height:1.15}
.rule{height:2px;width:96px;background:var(--gold);border-radius:2px;flex:none}
#orig{font-size:calc(var(--size)*.45);font-weight:700;line-height:1.3;color:var(--aqua);min-height:1.3em}
#live{font-size:var(--size);font-weight:800;line-height:1.08;text-wrap:balance;min-height:1.1em;color:#fff;text-shadow:0 3px 0 rgba(0,0,0,.5)}
#live.interim{opacity:.85}
body.hide-orig #orig{display:none}

/* --- Controles --- */
nav{position:fixed;left:0;right:0;margin:0 auto;width:fit-content;bottom:2.5vh;z-index:3;display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:8px;padding:8px;border-radius:16px;background:rgba(10,18,58,.86);border:1px solid rgba(255,255,255,.14);max-width:96vw;transition:opacity .4s}
body.idle nav,body.idle #msg{opacity:0;pointer-events:none}
button,select{font:600 15px Nunito,sans-serif;min-height:44px;border-radius:10px;border:1px solid rgba(255,255,255,.2);background:transparent;color:#fff;padding:0 14px;cursor:pointer}
select option{color:#111}
button:focus-visible,select:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
#start{background:var(--red);border-color:var(--red);font-weight:800;padding:0 20px}
.sq{width:44px;padding:0}
#msg{position:fixed;top:1.5vh;left:50%;transform:translateX(-50%);z-index:4;color:var(--gold);font-weight:600;font-size:15px;text-align:center;max-width:90vw}

/* --- Espera: temporizador y animación --- */
.cd-label{font-size:clamp(15px,2.6vh,22px);font-weight:700;color:var(--aqua);margin-top:.6vh;display:none}
.cd{display:none;gap:clamp(10px,1.6vw,22px);align-items:flex-start}
body.counting .cd{display:flex}body.counting .cd-label{display:block}body.counting .sub{display:none}
.cd>div{display:flex;flex-direction:column;align-items:center;gap:.6vh;min-width:clamp(80px,14vh,150px);padding:1.4vh 1vw;border-radius:18px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.16)}
.cd b{font-size:clamp(44px,12vh,110px);font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.cd span{font-size:clamp(11px,1.8vh,15px);font-weight:600;color:#cfe0f5}
.cd .sep{background:none;border:0;min-width:0;padding:1.4vh 0;font-size:clamp(44px,12vh,110px);font-weight:800;line-height:1;color:var(--gold)}
body.final .cd b{color:var(--gold);animation:pop 1s infinite}
@keyframes pop{0%{transform:scale(1.18)}40%{transform:scale(1)}}
.tree{position:fixed;bottom:2vh;height:min(46vh,30vw);z-index:1;pointer-events:none;transition:opacity .5s}
.tree svg{height:100%;width:auto;display:block}
.tree.l{left:3vw}.tree.r{right:3vw;transform:scaleX(-1)}
body.started .tree{opacity:0}
.bulb{animation:blink 1.6s infinite ease-in-out}
.bulb:nth-child(3n){animation-delay:.5s}.bulb:nth-child(3n+1){animation-delay:1s}
@keyframes blink{50%{opacity:.25}}
.star{transform-box:fill-box;transform-origin:center;animation:glow 2.4s infinite ease-in-out}
@keyframes glow{50%{transform:scale(1.18);opacity:.8}}
#shoot{position:fixed;top:12vh;left:-20vw;width:18vw;height:3px;border-radius:3px;background:linear-gradient(90deg,transparent,#fff);z-index:0;opacity:0;animation:shoot 9s 3s infinite linear}
@keyframes shoot{0%{transform:translate(0,0) rotate(12deg);opacity:0}3%{opacity:1}12%{transform:translate(70vw,15vh) rotate(12deg);opacity:0}100%{opacity:0}}
body.started #shoot{display:none}
#timer{display:flex;align-items:center;gap:6px}
#timer input{width:64px;font:600 15px Nunito,sans-serif;min-height:44px;border-radius:10px;border:1px solid rgba(255,255,255,.2);background:transparent;color:#fff;padding:0 8px;color-scheme:dark}
#timer select{padding:0 8px}

body.counting #welcome{gap:1.2vh;padding-bottom:6vh}
body.counting #welcome img{width:clamp(60px,11vh,110px);height:clamp(60px,11vh,110px)}
body.counting .big-title{font-size:clamp(36px,8vh,84px)}
body.counting .cd-label{font-size:clamp(18px,3.6vh,32px)}
body.counting .cd>div:not(.sep){min-width:clamp(130px,min(30vh,22vw),300px);padding:1.6vh 1.4vw;border-radius:24px;background:rgba(255,255,255,.1);border:2px solid rgba(255,255,255,.22)}
body.counting .cd b,body.counting .cd .sep{font-size:clamp(70px,min(27vh,17vw),260px)}
body.counting .cd .sep{padding-top:1.6vh;min-width:0}
body.counting .tree{height:min(36vh,22vw)}
body.counting .cd span{font-size:clamp(14px,2.6vh,24px)}
@media (max-height:560px){.tree{display:none}}
@media (prefers-reduced-motion:reduce){#snow,#shoot{display:none}body.on .dot,.bulb,.star,body.final .cd b{animation:none}}
</style>
</head>
<body>

</svg>

<div class="tree l"><svg viewBox="0 0 200 300" aria-hidden="true">
  <rect x="88" y="250" width="24" height="34" rx="3" fill="#7a4a2a"/>

  <g><circle class="bulb" cx="70" cy="122" r="6" fill="#ff4d5e"/><circle class="bulb" cx="100" cy="130" r="6" fill="#8ee6ec"/><circle class="bulb" cx="130" cy="119" r="6" fill="#ffd23f"/>
  <circle class="bulb" cx="55" cy="188" r="6" fill="#ffd23f"/><circle class="bulb" cx="88" cy="198" r="6" fill="#ff4d5e"/><circle class="bulb" cx="122" cy="196" r="6" fill="#8ee6ec"/><circle class="bulb" cx="152" cy="181" r="6" fill="#ff4d5e"/>
  <circle class="bulb" cx="40" cy="247" r="6" fill="#8ee6ec"/><circle class="bulb" cx="75" cy="258" r="6" fill="#ffd23f"/><circle class="bulb" cx="112" cy="259" r="6" fill="#ff4d5e"/><circle class="bulb" cx="150" cy="248" r="6" fill="#ffd23f"/></g>

</svg></div>
<div class="tree r"><svg viewBox="0 0 200 300" aria-hidden="true">
  <rect x="88" y="250" width="24" height="34" rx="3" fill="#7a4a2a"/>
  <polygon points="100,40 40,130 160,130" fill="#1f8a5b"/>
  <polygon points="100,85 25,195 175,195" fill="#18774d"/>
  <polygon points="100,140 10,258 190,258" fill="#12643f"/>
  <path d="M58 118 Q100 138 146 112 M40 182 Q100 206 164 176 M24 242 Q100 268 178 236" stroke="#ffd23f" stroke-width="3" fill="none" opacity=".8"/>
  <g><circle class="bulb" cx="70" cy="122" r="6" fill="#ff4d5e"/><circle class="bulb" cx="100" cy="130" r="6" fill="#8ee6ec"/><circle class="bulb" cx="130" cy="119" r="6" fill="#ffd23f"/>
  <circle class="bulb" cx="55" cy="188" r="6" fill="#ffd23f"/><circle class="bulb" cx="88" cy="198" r="6" fill="#ff4d5e"/><circle class="bulb" cx="122" cy="196" r="6" fill="#8ee6ec"/><circle class="bulb" cx="152" cy="181" r="6" fill="#ff4d5e"/>
  <circle class="bulb" cx="40" cy="247" r="6" fill="#8ee6ec"/><circle class="bulb" cx="75" cy="258" r="6" fill="#ffd23f"/><circle class="bulb" cx="112" cy="259" r="6" fill="#ff4d5e"/><circle class="bulb" cx="150" cy="248" r="6" fill="#ffd23f"/></g>
  <polygon class="star" points="100,4 108,24 129,24 112,37 118,57 100,45 82,57 88,37 71,24 92,24" fill="#ffd23f"/>

  <rect x="130" y="266" width="30" height="22" rx="3" fill="#8ee6ec"/><rect x="142" y="266" width="6" height="22" fill="#fff"/>
</svg></div>
<section id="welcome" class="layer">
  <img src="logo.jpg" alt="Escudo del Instituto Tlaquepaque">
  <div class="pre">Instituto Tlaquepaque presenta</div>
  <div class="big-title">Caroling Chill Festival</div>
  <div class="cd-label">Comenzamos en · Starting in</div>
  <div class="cd" role="timer"><div><b id="cdM">00</b><span>minutos</span></div><div class="sep">:</div><div><b id="cdS">10</b><span>segundos</span></div></div>
  <div class="sub" id="welcomeSub">Subtítulos en español en vivo · Live Spanish captions</div>
</section>

<section id="live-screen" class="layer">
  <header>
    <div class="brand">
      <img src="logo.jpg" alt="Escudo del Instituto Tlaquepaque">
      <div><div class="pre">Instituto Tlaquepaque presenta</div><div class="t">Caroling Chill Festival</div></div>
    </div>
    <span id="stxt" hidden></span>
  </header>
  <main>
    <div id="history"></div>
    <div class="rule"></div>
    <div id="orig"></div>
    <div id="live"></div>
  </main>
</section>

<div id="msg" role="status"></div>

<nav aria-label="Controles">
  <button id="start">▶ Iniciar</button>
  <select id="from" aria-label="Idioma que se habla"></select>
  <button id="swap" class="sq" aria-label="Invertir idiomas">⇄</button>
  <select id="to" aria-label="Idioma en pantalla"></select>
  <button id="smaller" class="sq" aria-label="Letra más chica">A−</button>
  <button id="bigger" class="sq" aria-label="Letra más grande">A+</button>
  <button id="toggleOrig">Ocultar original</button>
  <button id="clear">Limpiar</button>
  <button id="fs">Pantalla completa</button>
  <button id="wait">Pantalla de espera</button>
  <span id="timer"><input id="tAmt" type="number" min="1" max="120" value="10" aria-label="Duración del temporizador"><select id="tUnit" aria-label="Unidad"><option value="1">seg</option><option value="60">min</option></select><button id="tGo">Cuenta regresiva</button></span>
</nav>

<script>
{
const LANGS=[["en-US","en","Inglés","English"],["es-MX","es","Español","Spanish"],["fr-FR","fr","Francés","French"],["pt-BR","pt","Portugués","Portuguese"],["de-DE","de","Alemán","German"],["it-IT","it","Italiano","Italian"]];
const $=id=>document.getElementById(id);
const from=$("from"),to=$("to"),live=$("live"),orig=$("orig"),hist=$("history"),msg=$("msg");
const opts=LANGS.map(([s,,n])=>`<option value="${s}">${n}</option>`).join("");
from.innerHTML=opts;to.innerHTML=opts;
const store={get(k,d){try{return localStorage.getItem(k)??d}catch{return d}},set(k,v){try{localStorage.setItem(k,v)}catch{}}};
from.value=store.get("tr_from","en-US");to.value=store.get("tr_to","es-MX");
let size=+store.get("tr_scale",1)||1;
const setSize=()=>{size=Math.round(Math.max(.5,Math.min(1.6,size))*10)/10;document.documentElement.style.setProperty("--scale",size);store.set("tr_scale",size)};
setSize();
const lang=sel=>LANGS.find(l=>l[0]===sel.value);
const code=sel=>lang(sel)[1];
function labels(){
  const f=lang(from),t=lang(to);
  $("welcomeSub").textContent=`Subtítulos en ${t[2].toLowerCase()} en vivo · Live ${t[3]} captions`;
  $("stxt").textContent=(running?"En vivo":"En pausa")+` · ${f[2]} → ${t[2]}`;
}

/* ---------- Traducción: Chrome integrado → Google → MyMemory ---------- */
let native=null,nativeKey="";
const cache=new Map();
async function prepNative(){
  const key=code(from)+">"+code(to);
  if(nativeKey===key)return;
  native=null;nativeKey=key;
  if(code(from)===code(to)||!("Translator" in self))return;
  try{
    const a=await Translator.availability({sourceLanguage:code(from),targetLanguage:code(to)});
    if(a==="unavailable")return;
    native=await Translator.create({sourceLanguage:code(from),targetLanguage:code(to),
      monitor(){}});
  }catch(e){native=null}
}
async function translate(text){
  text=text.trim();if(!text)return"";
  const s=code(from),t=code(to);
  if(s===t)return text;
  const k=s+t+text;if(cache.has(k))return cache.get(k);
  let out="";
  if(native){try{out=await native.translate(text)}catch{}}
  if(!out){try{
    const r=await fetch(`https://translate.googleapis.com/translate_a/single?client=gtx&sl=${s}&tl=${t}&dt=t&q=${encodeURIComponent(text)}`);
    const j=await r.json();out=j[0].map(x=>x[0]).join("");
  }catch{}}
  if(!out){try{
    const r=await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=${s}|${t}`);
    const j=await r.json();out=j.responseData.translatedText||"";
  }catch{}}
  if(!out){msg.textContent="No se pudo traducir: revisa la conexión a internet.";return text}
  msg.textContent="";
  cache.set(k,out);if(cache.size>400)cache.delete(cache.keys().next().value);
  return out;
}

/* ---------- Reconocimiento de voz ---------- */
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
let rec=null,running=false,interimTimer=null,lastInterim="",seq=0,prevO="",prevT="";
if(!SR)msg.textContent="Este navegador no reconoce voz. Abre la página en Google Chrome o Microsoft Edge (computadora).";
function addHistory(tr){
  const d=document.createElement("div");d.className="line";d.textContent=tr;
  hist.appendChild(d);while(hist.children.length>1)hist.firstChild.remove();
}
function show(o,tr,interim){orig.textContent=o?`“${o}”`:"";live.textContent=tr;live.classList.toggle("interim",!!interim)}
function startRec(){
  if(!SR)return;
  rec=new SR();rec.lang=from.value;rec.continuous=true;rec.interimResults=true;rec.maxAlternatives=1;
  rec.onresult=async e=>{
    let interim="";
    for(let i=e.resultIndex;i<e.results.length;i++){
      const r=e.results[i],txt=r[0].transcript;
      if(r.isFinal){
        if(txt.trim().length<4)continue;
        clearTimeout(interimTimer);lastInterim="";++seq;
        const tr=await translate(txt);
        if(prevT)addHistory(prevT);
        show(txt,tr,false);prevO=txt;prevT=tr;
      }else interim+=txt;
    }
    if(interim.trim().length>3){
      orig.textContent=`“${interim}”`;
      lastInterim=interim;clearTimeout(interimTimer);
      interimTimer=setTimeout(async()=>{const q=lastInterim,my=seq;const tr=await translate(q);if(my===seq&&q===lastInterim)show(q,tr,true)},450);
    }
  };
  rec.onerror=e=>{
    if(e.error==="not-allowed"||e.error==="service-not-allowed"){msg.textContent="Permiso de micrófono denegado. Actívalo en el candado de la barra de direcciones.";stop()}
    else if(e.error==="network")msg.textContent="Sin conexión con el servicio de voz; reintentando…";
  };
  rec.onend=()=>{if(running)setTimeout(()=>{try{startRec()}catch{}},250)};
  try{rec.start()}catch{}
}
function start(){
  if(!SR)return;
  if(typeof cancelCd==="function"&&cdT)cancelCd();
  running=true;document.body.classList.add("on","started");$("start").textContent="■ Detener";
  msg.textContent="";labels();prepNative();startRec();wake();
}
function stop(){
  running=false;if(rec){rec.onend=null;try{rec.stop()}catch{}}
  document.body.classList.remove("on");$("start").textContent="▶ Iniciar";labels();wake();
}
function restart(){
  store.set("tr_from",from.value);store.set("tr_to",to.value);cache.clear();nativeKey="";labels();
  if(running){if(rec){rec.onend=null;try{rec.stop()}catch{}}prepNative();startRec()}
}

$("start").onclick=()=>running?stop():start();
from.onchange=restart;to.onchange=restart;
$("swap").onclick=()=>{const a=from.value;from.value=to.value;to.value=a;restart()};
$("bigger").onclick=()=>{size+=.1;setSize()};
$("smaller").onclick=()=>{size-=.1;setSize()};
$("toggleOrig").onclick=()=>{const h=document.body.classList.toggle("hide-orig");$("toggleOrig").textContent=h?"Mostrar original":"Ocultar original"};
$("clear").onclick=()=>{hist.innerHTML="";orig.textContent="";live.textContent="";prevO=prevT="";if(!running)document.body.classList.remove("started")};
$("fs").onclick=()=>{try{document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen()}catch{}};
document.addEventListener("keydown",e=>{
  if(e.target.tagName==="SELECT")return;
  if(e.code==="Space"){e.preventDefault();running?stop():start()}
  else if(e.key==="+"||e.key==="="){size+=.1;setSize()}
  else if(e.key==="-"){size-=.1;setSize()}
  else if(e.key==="f"||e.key==="F")$("fs").click();
});
/* ocultar controles tras 4 s sin mover el mouse */
let idleT;function wake(){document.body.classList.remove("idle");clearTimeout(idleT);idleT=setTimeout(()=>document.body.classList.add("idle"),4000)}
["mousemove","keydown","touchstart","click"].forEach(ev=>addEventListener(ev,wake));wake();
labels();


/* ---------- Temporizador antes de iniciar ---------- */
let cdEnd=0,cdT=null;
const tAmt=$("tAmt"),tUnit=$("tUnit");
tAmt.value=store.get("tr_tamt","10");tUnit.value=store.get("tr_tunit","1");
const pad=n=>String(n).padStart(2,"0");
function drawCd(sec){$("cdM").textContent=pad(Math.floor(sec/60));$("cdS").textContent=pad(sec%60);document.body.classList.toggle("final",sec<=10&&sec>0)}
function cancelCd(){clearInterval(cdT);cdT=null;document.body.classList.remove("counting","final");$("tGo").textContent="Cuenta regresiva"}
function startCd(){
  if(cdT){cancelCd();return}
  const secs=Math.max(1,Math.round((+tAmt.value||10)*(+tUnit.value)));
  store.set("tr_tamt",tAmt.value);store.set("tr_tunit",tUnit.value);
  if(running)stop();document.body.classList.remove("started");
  cdEnd=Date.now()+secs*1000;document.body.classList.add("counting");$("tGo").textContent="Cancelar cuenta";drawCd(secs);
  cdT=setInterval(()=>{const left=Math.ceil((cdEnd-Date.now())/1000);
    if(left<=0){cancelCd();start()}else drawCd(left)},200);
}
$("tGo").onclick=startCd;
$("wait").onclick=()=>{cancelCd();if(running)stop();document.body.classList.remove("started")};

/* ---------- Nieve ---------- */
const cv=$("snow"),cx=cv.getContext("2d");let flakes=[];
function resize(){cv.width=innerWidth;cv.height=innerHeight;flakes=Array.from({length:Math.round(innerWidth/16)},()=>({x:Math.random()*cv.width,y:Math.random()*cv.height,r:Math.random()*2.4+.6,s:Math.random()*.5+.2,w:Math.random()*Math.PI*2}))}
const snowRO=new ResizeObserver(resize);snowRO.observe(document.body);
(function tick(){cx.clearRect(0,0,cv.width,cv.height);cx.fillStyle="rgba(255,255,255,.5)";
  for(const f of flakes){f.y+=f.s;f.w+=.01;f.x+=Math.sin(f.w)*.3;if(f.y>cv.height){f.y=-5;f.x=Math.random()*cv.width}
    cx.beginPath();cx.arc(f.x,f.y,f.r,0,7);cx.fill()}
  requestAnimationFrame(tick)})();
}
</script>
